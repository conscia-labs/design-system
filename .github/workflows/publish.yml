name: Publish package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release tag $RELEASE_TAG must point to a commit on main."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify release version
        run: node scripts/verify-release-version.mjs

      - name: Validate release
        run: |
          pnpm lint
          pnpm lint:playground
          pnpm typecheck
          pnpm typecheck:playground
          pnpm test
          pnpm test:package
          pnpm test:consumer
          pnpm build:playground:static
          PLAYWRIGHT_CHANNEL=bundled pnpm exec playwright test playground/tests/phase7-quality.spec.ts --project=chromium
          PLAYWRIGHT_CHANNEL=bundled pnpm exec playwright test playground/tests/mobile-drawer.spec.ts --project=mobile-chromium

      - name: Check whether version is already published
        id: registry
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.registry.outputs.published != 'true'
        run: npm publish --access public
