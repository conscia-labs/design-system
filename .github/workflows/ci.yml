name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require releases to come from dev
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "dev" ]]; then
            echo "Pull requests to main must come from dev; merge feature branches into dev first."
            exit 1
          fi

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.3

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint && pnpm lint:playground

      - name: Type-check
        run: pnpm typecheck && pnpm typecheck:playground

      - name: Test
        run: pnpm test

      - name: Verify package
        run: pnpm test:package

      - name: Test packaged Tailwind consumer
        run: pnpm test:consumer

      - name: Build static playground
        run: pnpm build:playground:static
